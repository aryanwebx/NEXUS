<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer Olympic Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Summer Olympic Countdown</h1>
        <div id="days" class="time"></div>
        <div id="hours" class="time"></div>
        <div id="minutes" class="time"></div>
        <div id="seconds" class="time"></div>
        <div id="milliseconds" class="time"></div>
    </div>

    <script src="index.js"></script>
</body>
</html>
