<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Employee Details Form</h1>
    <form action="">
        <label for="Fname">Full Name:</label>
        <input type="text" id="Fname" name="UserName" placeholder="Enter your full name">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="UserEmail" placeholder="Enter your email address">
        <br><br>
        <label for="Pnumber">Phone Number:</label>
        <input type="tel" id="Pnumber" name="Mobileno" placeholder="Enter your phone number">
        <br><br>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>
        <br><br>
        <label for="jobtitle">Job Title:</label>
        <input type="text" id="jobtitle" name="JobTitle" placeholder="Enter your job title">
        <br><br>
        <label for="department">Department:</label>
       <select name="Department" id="department">
        <option value="">Select your department</option>
        <option value="">CSE Department</option>
        <option value="">IT Department</option>
        <option value="">EE Department</option>
        <option value="">ECE Department</option>
       </select>
       <br><br>   
       <button>Submit</button>
    </form>
</body>

</html>
