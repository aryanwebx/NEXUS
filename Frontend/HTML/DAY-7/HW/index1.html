<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Feedback Form</h2>
    <form action="">
        <label for="name">Your Name:</label>
        <input type="text" id="name" name="UserName">
        <br><br>
        <label for="email">Your Email:</label>
        <input type="email" id="email" name="UserEmail">
        <br><br>
        <label for="rateus">Rate Us:</label>
        <input type="radio" id="1" name="RateUs">1 Star
        <input type="radio" id="2" name="RateUs">2 Star
        <input type="radio" id="3" name="RateUs">3 Star
        <input type="radio" id="4" name="RateUs">4 Star
        <input type="radio" id="5" name="RateUs">5 Star
        <br><br>
        <label for="Comments">Comments:</label>
        <textarea name="Comments" id="Comments" rows="4"></textarea>
        <br><br>
        <button>Submit Feedback</button>
    </form>
</body>

</html>
